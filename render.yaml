services:
  - type: web
    name: availabilityshield-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:cloud
    healthCheckPath: /__shield/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROTECTED_APP_HOST
        value: 127.0.0.1
      - key: PROTECTED_APP_PORT
        value: 3000
      - key: PROTECTED_TARGET
        value: http://127.0.0.1:3000
      - key: TRUST_PROXY
        value: "true"
      - key: AVAILABILITYSHIELD_DB_PATH
        value: /tmp/availabilityshield.db
      - key: AVAILABILITYSHIELD_LOG_DIR
        value: /tmp/availabilityshield-logs
      - key: FRONTEND_ORIGIN
        sync: false

  - type: static
    name: availabilityshield-dashboard
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
