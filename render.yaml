services:
  - type: web
    name: availabilityshield-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:gateway
    healthCheckPath: /__shield/health
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROTECTED_TARGET
        value: https://availabilityshield-protected-app.onrender.com
      - key: PROTECTED_APP_AUTH_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: AVAILABILITYSHIELD_DB_PATH
        value: /tmp/availabilityshield.db
      - key: AVAILABILITYSHIELD_LOG_DIR
        value: /tmp/availabilityshield-logs
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: availabilityshield-protected-app
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:app
    healthCheckPath: /health
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROTECTED_APP_HOST
        value: 0.0.0.0
      - key: PROTECTED_APP_AUTH_TOKEN
        fromService:
          type: web
          name: availabilityshield-api
          envVarKey: PROTECTED_APP_AUTH_TOKEN

  - type: web
    name: availabilityshield-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
